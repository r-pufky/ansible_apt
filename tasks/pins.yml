---
###############################################################################
# Apt Pins
###############################################################################
#
# Args:
#   pin: dict - apt_pins dict item.
#
# Reference:
# * https://manpages.debian.org/trixie/apt/apt_preferences.5.en.html
# * https://wiki.debian.org/AptConfiguration

- name: '{{ "Pins | filesystem | remove /etc/apt/preferences.d/" ~ pin.name }}'
  when: pin.state == 'absent'
  ansible.builtin.file:
    path: '{{ "/etc/apt/preferences.d/" ~ pin.name }}'
    state: 'absent'

- name: '{{ "Pin | filesystem | set /etc/apt/preferences.d/" ~ pin.name }}'
  when: pin.state == 'present'
  ansible.builtin.template:
    src: 'pin.j2'
    dest: '{{ "/etc/apt/preferences.d/" ~ pin.name }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
