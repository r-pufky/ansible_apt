---
###############################################################################
# Unattended Updates and Upgrades.
###############################################################################
# Setup automatic updates and reboots.
#
# Decision: Enabling updates will install package but not remove them - in prod
#     use this allows for temporarily disabling if there are package problems,
#     without package thrashing.
#
# Reference:
# * https://wiki.debian.org/UnattendedUpgrades
# * /etc/cron.daily/apt-compat
# * /usr/lib/apt/apt.systemd.daily

- name: 'Unattended | apt | install required packages'
  ansible.builtin.apt:
    name: '{{ apt___unattended_packages }}'
    autoremove: '{{ apt_srv_package_autoremove | default(true) }}'
    purge: '{{ apt_srv_package_purge | default(true) }}'
    update_cache: '{{ apt_srv_package_update_cache | default(false) }}'
    install_recommends:
      '{{ apt_srv_package_install_recommends | default(true) }}'
    state: 'present'

- name: 'Unattended | apt | install AC power management detection'
  when: apt_uu_ac_only_enable
  ansible.builtin.apt:
    name: '{{ apt___ac_power_packages }}'
    state: '{{ apt_srv_package_state | default(apt___app._state) }}'

- name: 'Unattended | filesystem | set /etc/apt/apt.conf.d/20auto-upgrades'
  notify: 'Handlers | unattended-upgrades'
  ansible.builtin.template:
    src: '20auto-upgrades.j2'
    dest: '/etc/apt/apt.conf.d/20auto-upgrades'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: '{{
      "Unattended | filesystem | set " ~
      "/etc/apt/apt.conf.d/52unattended-upgrades-local"
    }}'
  notify: 'Handlers | unattended-upgrades'
  ansible.builtin.template:
    src: '52unattended-upgrades-local.j2'
    dest: '/etc/apt/apt.conf.d/52unattended-upgrades-local'
    owner: 'root'
    group: 'root'
    mode: '0644'
