---
- name: 'Install | packages'
  ansible.builtin.apt:
    name: '{{ apt___packages }}'
    state: 'present'

- name: 'Pins'
  when: apt_pins | length > 0
  ansible.builtin.include_tasks: 'pins.yml'
  loop: '{{ apt_pins }}'
  loop_control:
    loop_var: 'pin'
    label: '{{ pin.name }}'

- name: 'Sources'
  ansible.builtin.import_tasks: 'sources.yml'
- name: 'Packages'
  ansible.builtin.import_tasks: 'packages.yml'

- name: 'Unattended'
  when: apt_uu_enable
  ansible.builtin.import_tasks: 'unattended.yml'
