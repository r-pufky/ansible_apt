---
###############################################################################
# APT Role Options
###############################################################################

apt___release: "{{ {} | r_pufky.data.v3(

    _date='2026-03-08',
    _debian='trixie',
  ) }}"

apt___app: "{{ {} | r_pufky.data.v3(

    _state='present',
    _timeout=600,
    _poll=5,
  ) }}"

###############################################################################
# APT Packages
###############################################################################

apt___packages:
  - 'python3-debian'  # DEB822.
  - 'ca-certificates'  # CA certificates for apt source validation.

apt___unattended_packages:
  - 'apt-listchanges'  # Installed by default.
  - 'unattended-upgrades'  # Installed by default.
  - 'apt-config-auto-update'  # Config automation support.

apt___ac_power_packages:
  - 'powermgmt-base'  # Power management detection.
