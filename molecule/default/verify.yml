---
- name: 'Verify'
  hosts: 'all'
  gather_facts: false
  tasks:
    - name: 'Verify | test | /etc/apt/sources.list.d/'
      ansible.builtin.include_role:
        name: 'r_pufky.data.test'
        tasks_from: 'file.yml'
      vars:
        test_name: '{{ "Verify | test | " ~ item }}'
        test_file: '{{ item }}'
        test_owner: 'root'
        test_group: 'root'
        test_mode: '0644'
        test_state: 'file'
        test_diff: true
      loop:
        - '/etc/apt/sources.list.d/debian.sources'
        - '/etc/apt/sources.list.d/debian-security.sources'

- name: 'Verify'
  hosts: 'apt-default-unattended'
  gather_facts: false
  tasks:
    - name: 'Verify | test | /etc/apt/apt.conf.d/'
      ansible.builtin.include_role:
        name: 'r_pufky.data.test'
        tasks_from: 'file.yml'
      vars:
        test_name: '{{ "Verify | test | " ~ item }}'
        test_file: '{{ item }}'
        test_owner: 'root'
        test_group: 'root'
        test_mode: '0644'
        test_state: 'file'
        test_diff: true
      loop:
        - '/etc/apt/apt.conf.d/20auto-upgrades'
        - '/etc/apt/apt.conf.d/50unattended-upgrades'

    - name: 'Verify | fact | query installed packages'
      ansible.builtin.package_facts:

    - name: 'Verify | fact | query service status'
      ansible.builtin.service_facts:

    - name: 'Verify | assert | unattended packages installed/removed'
      ansible.builtin.assert:
        quiet: true
        that:
          - '"apt-listchanges" in ansible_facts.packages'
          - '"unattended-upgrades" in ansible_facts.packages'
          - '"apt-config-auto-update" in ansible_facts.packages'
          - '"powermgmt-base" not in ansible_facts.packages'
        fail_msg: |

          ✘ Package state incorrect:

          Should be installed:
          * apt-listchanges
          * unattended-upgrades
          * apt-config-auto-update

          Should NOT be installed:
          * powermgmt-base

    - name: 'Verify | assert | services active'
      ansible.builtin.assert:
        quiet: true
        that:
          - '"apt-daily.service" in ansible_facts.services'
          - '"apt-daily-upgrade.service" in ansible_facts.services'
          - '"unattended-upgrades.service" in ansible_facts.services'
        fail_msg: |

          ✘ Services should be enabled:

          * apt-daily
          * apt-upgrade
          * unattended-upgrade

    - name: 'Verify | cmd | execute dry run config check'
      ansible.builtin.command: 'unattended-upgrade --dry-run'
      register: apt__test_unattended_upgrade_check
      changed_when: false
      failed_when: apt__test_unattended_upgrade_check.rc != 0

    - name: 'Verify | test | /etc/apt/apt.conf.d/52unattended-upgrades-local'
      ansible.builtin.include_role:
        name: 'r_pufky.data.test'
        tasks_from: 'copy.yml'
      vars:
        test_name:
          'Verify | test | /etc/apt/apt.conf.d/52unattended-upgrades-local'
        test_src: 'files/52unattended-upgrades-local'
        test_file: '/etc/apt/apt.conf.d/52unattended-upgrades-local'
        test_owner: 'root'
        test_group: 'root'
        test_mode: '0644'
        test_diff: true

    - name: 'Verify | test | /etc/apt/sources.list'
      ansible.builtin.include_role:
        name: 'r_pufky.data.test'
        tasks_from: 'copy.yml'
      vars:
        test_name: 'Verify | test | /etc/apt/sources.list'
        test_src: 'files/sources.list.disabled'
        test_file: '/etc/apt/sources.list'
        test_owner: 'root'
        test_group: 'root'
        test_mode: '0644'
        test_diff: true
