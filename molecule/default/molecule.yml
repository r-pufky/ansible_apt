---
###############################################################################
# Default
###############################################################################
# Ensure defaults work with and without unattended upgrades enabled.
#
# dist-upgrade will only appear in history.log if action taken (running
# with no upgrade will not be logged) which will only occur if there is a
# distribution upgrade before the source container is updated.
#
# Decision: ignore testing - this is a simple boolean variable.
#
# Tests (default):
# * Configured files:
#   * sources.list.d/debian-security.sources
#   * sources.list.d/debian.sources
#   * apt.conf.d/20auto-upgrades
#   * apt.conf.d/50unattended-upgrades
# * Services active:
#   * apt-daily
#   * apt-daily-upgrade
#   * unattended-upgrades
# * Packages installed:
#   * apt-listchanges
#   * unattended-upgrades
#   * apt-config-auto-update
#   * powermgmt-base
# * sources.list is disabled correctly for non-existing file.
#
# Tests (unattended):
# * Configured files:
#   * apt.conf.d/52unattended-upgrades-local
# * sources.list is disabled correctly for existing file.

dependency:
  name: 'galaxy'
driver:
  name: 'podman'
provisioner:
  name: 'ansible'
  config_options:
    defaults:
      interpreter_python: 'auto_silent'
      callback_whitelist: 'profile_tasks, timer, yaml'
    ssh_connection:
      pipelining: false
  inventory:
    group_vars:
      all:
        apt_srv_sources_list_disable: true
        apt_srv_auto_grub_boot: true  # Test no effect for containers.
    host_vars:
      apt-default-unattended:
        apt_uu_enable: true
        apt_uu_automatic_reboot: true
        apt_uu_automatic_reboot_time: '04:00'
platforms:
  - name: 'apt-default'
    image: 'ghcr.io/hifis-net/debian-systemd:13'
    systemd: 'always'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    command: '/lib/systemd/systemd'
    pre_build_image: true
  - name: 'apt-default-unattended'
    image: 'ghcr.io/hifis-net/debian-systemd:13'
    systemd: 'always'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    command: '/lib/systemd/systemd'
    pre_build_image: true
verifier:
  name: 'ansible'
scenario:
  test_sequence:
    - 'destroy'
    - 'syntax'
    - 'create'
    - 'prepare'
    - 'converge'
    - 'idempotence'
    - 'verify'
    - 'destroy'
