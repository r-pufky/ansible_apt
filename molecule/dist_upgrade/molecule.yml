---
###############################################################################
# Dist Upgrade
###############################################################################
# dist-upgrade will only appear in history.log if upgrade action taken (running
# with no upgrade will not be logged) which will only occur if there is a
# distribution upgrade before the source container is updated.
#
# Manual test verification is required.
#
# Tests (dist_upgrade):
# * apt_srv_dist_upgrade_always=false dist-upgrade run once for multiple
#   applications.
#
# Tests (dist_upgrade_disable):
# * apt_srv_dist_upgrade_always=true dist-upgrade run multiple times for
#   multiple applications.
#
# Tests (dist_upgrade_enable):
# * apt_srv_dist_upgrade_disable=true disables all dist-upgrades.

dependency:
  name: 'galaxy'
driver:
  name: 'podman'
provisioner:
  name: 'ansible'
  config_options:
    defaults:
      interpreter_python: 'auto_silent'
      callback_whitelist: 'profile_tasks, timer, yaml'
    ssh_connection:
      pipelining: false
  inventory:
    group_vars:
      all:
        apt_srv_dist_upgrade_always: false
    host_vars:
      apt-dist-upgrade-disable:
        apt_srv_dist_upgrade_disable: true
      apt-dist-upgrade-enable:
        apt_srv_dist_upgrade_always: true
platforms:
  - name: 'apt-dist-upgrade'
    image: 'ghcr.io/hifis-net/debian-systemd:13'
    systemd: 'always'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    command: '/lib/systemd/systemd'
    pre_build_image: true
  - name: 'apt-dist-upgrade-disable'
    image: 'ghcr.io/hifis-net/debian-systemd:13'
    systemd: 'always'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    command: '/lib/systemd/systemd'
    pre_build_image: true
  - name: 'apt-dist-upgrade-enable'
    image: 'ghcr.io/hifis-net/debian-systemd:13'
    systemd: 'always'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    command: '/lib/systemd/systemd'
    pre_build_image: true
verifier:
  name: 'ansible'
scenario:
  test_sequence:
    - 'destroy'
    - 'syntax'
    - 'create'
    - 'converge'
    - 'idempotence'
    - 'verify'
    - 'destroy'
